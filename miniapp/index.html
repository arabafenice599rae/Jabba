<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Jabba Curve — Simulator</title>
<style>
  :root {
    --bg:#0b0e14; --card:linear-gradient(180deg,#151b26 0%,#11151d 100%);
    --border:#232b38; --border-hi:#2f3b4f; --text:#e8eef5; --muted:#7d8a9b;
    --green:#14f195; --purple:#9945ff; --gold:#f4ce4a; --red:#ff5d5d;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,
         "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding:14px;
         max-width:640px; margin:0 auto; min-height:100vh;
         background-image:radial-gradient(1200px 500px at 50% -10%, #101623 0%, var(--bg) 60%); }
  header { display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  h1 { font-size:17px; font-weight:700; letter-spacing:.2px; }
  .logo { width:30px; height:30px; border-radius:9px; flex:0 0 auto;
          background:linear-gradient(135deg,#14f195,#9945ff);
          display:flex; align-items:center; justify-content:center; font-size:15px; }
  .sub { color:var(--muted); font-size:12px; margin:2px 0 14px 40px; }
  .stats { display:flex; gap:10px; margin-bottom:14px; }
  .stat { flex:1; border:1px solid var(--border); border-radius:14px;
          padding:12px 8px; text-align:center; background:var(--card); }
  .stat .v { font-size:14px; font-weight:700; color:var(--green);
             font-variant-numeric:tabular-nums; word-break:break-all; }
  .stat .l { font-size:10px; color:var(--muted); margin-top:3px; text-transform:uppercase;
             letter-spacing:.5px; }
  .card { border:1px solid var(--border); border-radius:14px; padding:14px;
          margin-bottom:14px; background:var(--card); }
  canvas { width:100%; height:250px; display:block; border-radius:8px; touch-action:none; }
  .hint { font-size:11px; color:var(--muted); margin-top:8px; text-align:center;
          font-variant-numeric:tabular-nums; min-height:14px; transition:opacity .15s; }
  .seg { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .seg button { padding:10px; border-radius:11px; border:1px solid var(--border);
                background:#141924; color:var(--muted); font-size:13px; font-weight:600;
                transition:all .15s ease; }
  .seg button.on { color:#0b0e14; border-color:transparent; }
  #tab-buy.on  { background:linear-gradient(135deg,#14f195,#0fd47f); box-shadow:0 2px 14px rgba(20,241,149,.35); }
  #tab-sell.on { background:linear-gradient(135deg,#f4ce4a,#e8a93a); box-shadow:0 2px 14px rgba(244,206,74,.3); }
  label { font-size:12px; color:var(--muted); display:flex; justify-content:space-between;
          margin-bottom:8px; text-transform:uppercase; letter-spacing:.5px; }
  label b { color:var(--text); font-variant-numeric:tabular-nums; text-transform:none; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:6px;
                      border-radius:6px; background:linear-gradient(90deg,var(--green) var(--p,20%),#232b38 var(--p,20%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px;
    border-radius:50%; background:#fff; border:3px solid var(--green);
    box-shadow:0 2px 10px rgba(20,241,149,.5); }
  input[type=range]::-moz-range-thumb { width:18px; height:18px; border-radius:50%;
    background:#fff; border:3px solid var(--green); }
  .rows { margin-top:12px; }
  .row { display:flex; justify-content:space-between; font-size:13px; margin:7px 0;
         color:var(--muted); font-variant-numeric:tabular-nums; }
  .row span:last-child { color:var(--text); }
  .result { display:flex; justify-content:space-between; align-items:center; margin-top:12px;
            padding:12px 14px; border-radius:11px; background:rgba(20,241,149,.07);
            border:1px solid rgba(20,241,149,.25); font-size:13px; }
  .result b { font-size:16px; color:var(--green); font-variant-numeric:tabular-nums; }
  .foot { text-align:center; font-size:10px; color:var(--muted); padding:4px 0 8px; }
</style>
</head>
<body>
<header><div class="logo">📈</div><h1>Jabba Curve</h1></header>
<div class="sub">Drag across the chart to explore the curve</div>

<div class="stats">
  <div class="stat"><div class="v" id="s-price">–</div><div class="l">Price (SOL)</div></div>
  <div class="stat"><div class="v" id="s-supply">–</div><div class="l">Supply</div></div>
  <div class="stat"><div class="v" id="s-fee">–</div><div class="l">Fee</div></div>
</div>

<div class="card">
  <canvas id="chart"></canvas>
  <div class="hint" id="hover"></div>
</div>

<div class="card">
  <div class="seg">
    <button id="tab-buy" class="on">💰 Buy</button>
    <button id="tab-sell">📤 Sell</button>
  </div>
  <label id="amt-label">Deposit <b id="amt-val"></b></label>
  <input type="range" id="amt" min="0" max="5" step="0.05" value="1">
  <div class="rows">
    <div class="row"><span id="r1">–</span><span id="r2">–</span></div>
    <div class="row"><span id="r3">–</span><span id="r4">–</span></div>
  </div>
  <div class="result"><span id="res-label">You receive</span><b id="res">–</b></div>
</div>

<div class="foot">Simulator only — trades happen in the Telegram bot</div>

<script>
'use strict';
const q = new URLSearchParams(location.search);
const P0 = parseFloat(q.get('p0') || '0.00001');
const M  = parseFloat(q.get('m')  || '0.0000000005');
const SUPPLY = parseFloat(q.get('supply') || '0');
const FEEBP = parseFloat(q.get('feebp') || '30');
const FEE = FEEBP / 10000;
const fmt = (n, d = 2) => n.toLocaleString('en-US',
  { minimumFractionDigits: d, maximumFractionDigits: d });

const price = s => P0 + M * s;
const cost = (x, s) => P0 * x + M * s * x + M * x * x / 2;
const tokensOut = (amt, s) => M <= 0 ? amt / P0
  : (-(P0 + M * s) + Math.sqrt((P0 + M * s) ** 2 + 2 * M * amt)) / M;
const sellGross = (x, s) => {
  const sold = Math.min(x, s);
  return P0 * sold + M * Math.max(0, s * sold - sold * sold / 2);
};

document.getElementById('s-price').textContent = price(SUPPLY).toFixed(10);
document.getElementById('s-supply').textContent = fmt(SUPPLY, 0);
document.getElementById('s-fee').textContent = (FEEBP / 100).toFixed(2) + '%';

const cv = document.getElementById('chart'), ctx = cv.getContext('2d');
const hoverEl = document.getElementById('hover');
let W = 0, H = 0, xMax = Math.max(SUPPLY * 1.6, 1000), yMax = price(xMax) * 1.08;
let hoverS = null, raf = 0;

// static layer: curve, fill, grid, supply marker — drawn once per resize
const base = document.createElement('canvas');
const bctx = base.getContext('2d');

function sx(s) { return s / xMax * (W - 12) + 6; }
function sy(p) { return H - 10 - p / yMax * (H - 20); }

function drawBase() {
  bctx.setTransform(1, 0, 0, 1, 0, 0);
  bctx.clearRect(0, 0, base.width, base.height);
  const d = window.devicePixelRatio || 1;
  bctx.setTransform(d, 0, 0, d, 0, 0);

  bctx.strokeStyle = '#1a2230'; bctx.lineWidth = 0.5;
  for (let i = 1; i <= 4; i++) {
    const y = 10 + (i - 0.5) * (H - 20) / 4;
    bctx.beginPath(); bctx.moveTo(0, y); bctx.lineTo(W, y); bctx.stroke();
  }

  const path = new Path2D();
  for (let i = 0; i <= 160; i++) {
    const s = xMax * i / 160, x = sx(s), y = sy(price(s));
    i ? path.lineTo(x, y) : path.moveTo(x, y);
  }
  const fill = new Path2D(path);
  fill.lineTo(sx(xMax), H - 8); fill.lineTo(sx(0), H - 8); fill.closePath();
  const g = bctx.createLinearGradient(0, 10, 0, H);
  g.addColorStop(0, 'rgba(20,241,149,0.28)');
  g.addColorStop(1, 'rgba(20,241,149,0.02)');
  bctx.fillStyle = g; bctx.fill(fill);

  bctx.save();
  bctx.shadowColor = 'rgba(20,241,149,0.55)'; bctx.shadowBlur = 8;
  bctx.strokeStyle = '#14f195'; bctx.lineWidth = 2.6;
  bctx.stroke(path);
  bctx.restore();

  if (SUPPLY > 0 && SUPPLY <= xMax) {
    bctx.strokeStyle = 'rgba(153,69,255,0.85)'; bctx.setLineDash([4, 4]); bctx.lineWidth = 1.2;
    bctx.beginPath(); bctx.moveTo(sx(SUPPLY), 10); bctx.lineTo(sx(SUPPLY), H - 8); bctx.stroke();
    bctx.setLineDash([]);
    bctx.fillStyle = '#f4ce4a'; bctx.shadowColor = 'rgba(244,206,74,0.7)'; bctx.shadowBlur = 8;
    bctx.beginPath(); bctx.arc(sx(SUPPLY), sy(price(SUPPLY)), 5, 0, 7); bctx.fill();
    bctx.shadowBlur = 0;
  }
}

function draw() {
  const d = window.devicePixelRatio || 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.drawImage(base, 0, 0);
  ctx.setTransform(d, 0, 0, d, 0, 0);
  if (hoverS == null) return;
  const x = sx(hoverS), y = sy(price(hoverS));
  ctx.strokeStyle = 'rgba(244,206,74,0.45)';
  ctx.beginPath(); ctx.moveTo(x, 10); ctx.lineTo(x, H - 8); ctx.stroke();
  ctx.fillStyle = '#f4ce4a'; ctx.shadowColor = 'rgba(244,206,74,0.8)'; ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.arc(x, y, 4.5, 0, 7); ctx.fill();
  ctx.shadowBlur = 0;
}

function resize() {
  const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d);
  base.width = cv.width; base.height = cv.height;
  W = r.width; H = r.height;
  drawBase(); draw();
}

function onMove(e) {
  const r = cv.getBoundingClientRect();
  hoverS = Math.max(0, Math.min(xMax, (e.clientX - r.left - 6) / (W - 12) * xMax));
  hoverEl.textContent = fmt(hoverS, 0) + ' tokens → ' + price(hoverS).toFixed(10) + ' SOL';
  if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); });
}
function onLeave() {
  hoverS = null; hoverEl.textContent = '';
  if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); });
}
cv.addEventListener('pointermove', onMove, { passive: true });
cv.addEventListener('pointerdown', onMove, { passive: true });
cv.addEventListener('pointerleave', onLeave, { passive: true });
cv.addEventListener('pointercancel', onLeave, { passive: true });
window.addEventListener('resize', resize, { passive: true });

let mode = 'buy';
const amt = document.getElementById('amt');
const $ = id => document.getElementById(id);
function paintSlider() {
  const p = (amt.value - amt.min) / (amt.max - amt.min) * 100;
  amt.style.setProperty('--p', p + '%');
}
function setMode(m) {
  mode = m;
  $('tab-buy').classList.toggle('on', m === 'buy');
  $('tab-sell').classList.toggle('on', m === 'sell');
  amt.max = m === 'buy' ? '5' : '100';
  amt.value = m === 'buy' ? '1' : '25';
  $('amt-label').firstChild.textContent = m === 'buy' ? 'Deposit ' : 'Sell ';
  update();
}
function update() {
  const v = parseFloat(amt.value);
  $('amt-val').textContent = mode === 'buy' ? fmt(v) + ' SOL' : fmt(v, 0) + ' tokens';
  if (mode === 'buy') {
    const fee = v * FEE, net = v - fee, tk = tokensOut(net, SUPPLY);
    $('r1').textContent = 'Fee (' + (FEEBP / 100).toFixed(2) + '%)'; $('r2').textContent = fmt(fee, 6) + ' SOL';
    $('r3').textContent = 'On the curve'; $('r4').textContent = fmt(net, 6) + ' SOL';
    $('res-label').textContent = 'You receive';
    $('res').textContent = '≈ ' + fmt(tk) + ' tokens';
  } else {
    const gross = sellGross(v, SUPPLY), fee = gross * FEE, net = gross - fee;
    $('r1').textContent = 'Gross value'; $('r2').textContent = fmt(gross, 6) + ' SOL';
    $('r3').textContent = 'Fee (' + (FEEBP / 100).toFixed(2) + '%)'; $('r4').textContent = fmt(fee, 6) + ' SOL';
    $('res-label').textContent = 'You receive';
    $('res').textContent = fmt(net, 6) + ' SOL';
  }
  paintSlider();
}
amt.addEventListener('input', update, { passive: true });
$('tab-buy').addEventListener('click', () => setMode('buy'));
$('tab-sell').addEventListener('click', () => setMode('sell'));

resize(); update();
</script>
</body>
</html>
